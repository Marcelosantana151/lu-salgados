<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lu Salgados">
<meta name="theme-color" content="#3a2417">
<title>Lu Salgados</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Josefin+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6efe4; --card: #fffaf2; --texto: #2b1a10; --suave: #7d6552; --linha: #e6d8c3;
    --pri: #5a3521; --sobre-pri: #fff8ea; --pri-claro: #f1e3cc; --ok: #3f7a2e; --ok-claro: #e7f1dc; --ruim: #a8321f; --ruim-claro: #f9e4dc;
    --aviso: #8a5a12; --aviso-claro: #f8ecd2; --sombra: 0 1px 3px rgba(58,36,23,.10);
    --madeira: #3a2417; --ouro: #ecd09a; --caramelo: #c98a3c;
    --script: 'Great Vibes', 'Brush Script MT', cursive; --titulo: 'Josefin Sans', -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c130d; --card: #2a1c13; --texto: #f5e9d6; --suave: #b39b82; --linha: #3e2b1e;
      --pri: #e3bd7a; --sobre-pri: #2b1a10; --pri-claro: #3b2a1a; --ok: #9bcf7c; --ok-claro: #20301a; --ruim: #f08a70; --ruim-claro: #3a1f17;
      --aviso: #e9c46a; --aviso-claro: #362a12; --sombra: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--texto);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .topo { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px;
    padding: calc(8px + env(safe-area-inset-top)) 16px 8px; color: var(--ouro);
    background: var(--madeira) repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 2px, transparent 2px 20px, rgba(0,0,0,.22) 20px 22px, transparent 22px 44px);
    box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  .topo .titulo { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .topo .titulo span:first-child { font-family: var(--script); font-size: 32px; line-height: 1.1; color: var(--ouro);
    text-shadow: 0 2px 3px rgba(0,0,0,.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topo .titulo .croissant { font-size: 22px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  .sync { font-size: 13px; opacity: .9; font-family: var(--titulo); }
  .icone { background: rgba(236,208,154,.14); border: 1px solid rgba(236,208,154,.25); color: var(--ouro); width: 38px; height: 38px; border-radius: 10px; font-size: 18px; }
  main { padding: 12px 16px calc(150px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
  .abas { position: fixed; bottom: 0; left: 0; right: 0; z-index: 6; display: flex; background: var(--card);
    border-top: 1px solid var(--linha); padding-bottom: env(safe-area-inset-bottom); }
  .abas button { flex: 1; border: 0; background: none; padding: 8px 0 6px; font-size: 20px; color: var(--suave);
    display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .abas button span { font-size: 12px; font-family: var(--titulo); letter-spacing: .04em; }
  .abas button.ativa { color: var(--pri); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--linha); border-radius: 14px; padding: 14px; margin-bottom: 10px; box-shadow: var(--sombra); }
  h2 { font: 600 14px var(--titulo); margin: 20px 2px 8px; color: var(--suave); text-transform: uppercase; letter-spacing: .12em; }
  .muted { color: var(--suave); } .small { font-size: 13px; }
  .navdata { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .navdata button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--linha); background: var(--card); font-size: 20px; }
  .navdata .meio { flex: 1; text-align: center; }
  .navdata .meio b { display: block; font-size: 17px; }
  .navdata input[type=date] { border: 0; background: none; color: var(--suave); font-size: 13px; text-align: center; }
  .item-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .item-top b { font-size: 16px; }
  .campos { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; margin-top: 10px; align-items: end; }
  label { display: block; font-size: 13px; color: var(--suave); }
  input, select, textarea { width: 100%; margin-top: 4px; padding: 11px 12px; border: 1px solid var(--linha); border-radius: 10px;
    background: var(--bg); font-size: 17px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--pri); border-color: transparent; }
  .sobra { text-align: center; min-width: 64px; font-size: 13px; color: var(--suave); padding-bottom: 6px; }
  .sobra b { display: block; font-size: 20px; color: var(--texto); }
  .sobra.tem b { color: var(--ruim); }
  .linha-extra { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--linha); background: var(--card); border-radius: 999px; padding: 7px 12px; font-size: 14px; }
  .chip.ativo { background: var(--pri); border-color: var(--pri); color: var(--sobre-pri); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .rodape-dia { position: fixed; left: 0; right: 0; bottom: calc(58px + env(safe-area-inset-bottom)); z-index: 4;
    background: var(--card); border-top: 1px solid var(--linha); padding: 10px 16px; }
  .rodape-dia .in { max-width: 640px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .tot { flex: 1; display: flex; gap: 12px; font-size: 12px; color: var(--suave); }
  .tot b { display: block; font-size: 15px; color: var(--texto); }
  .btn { border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 600; background: var(--pri); color: var(--sobre-pri); font-size: 16px; }
  .btn:disabled { opacity: .45; }
  .btn.sec { background: var(--pri-claro); color: var(--pri); }
  .btn.perigo { background: var(--ruim-claro); color: var(--ruim); }
  .btn.cheio { width: 100%; margin-top: 10px; }
  .grade2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grade3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .kpi { background: var(--card); border: 1px solid var(--linha); border-radius: 14px; padding: 12px; box-shadow: var(--sombra); }
  .kpi .r { font: 600 11px var(--titulo); color: var(--suave); text-transform: uppercase; letter-spacing: .1em; }
  .kpi .v { font-size: 20px; font-weight: 700; margin: 2px 0; }
  .kpi .d { font-size: 12px; color: var(--suave); }
  .pos { color: var(--ok) !important; } .neg { color: var(--ruim) !important; }
  .barra { height: 12px; background: var(--linha); border-radius: 999px; overflow: hidden; margin: 8px 0; }
  .barra > div { height: 100%; background: linear-gradient(90deg, var(--caramelo), var(--ouro)); border-radius: 999px; }
  .alerta { border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-bottom: 10px; }
  .alerta.ruim { background: var(--ruim-claro); color: var(--ruim); }
  .alerta.ok { background: var(--ok-claro); color: var(--ok); }
  .alerta.aviso { background: var(--aviso-claro); color: var(--aviso); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 600; font-size: 12px; color: var(--suave); padding: 6px 4px; border-bottom: 1px solid var(--linha); }
  td { padding: 8px 4px; border-bottom: 1px solid var(--linha); }
  td.n, th.n { text-align: right; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  .lista-linha { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--linha); }
  .lista-linha:last-child { border-bottom: 0; }
  .lista-linha button.link { background: none; border: 0; padding: 0; text-align: left; flex: 1; }
  .grafico { display: flex; align-items: flex-end; gap: 2px; height: 90px; margin-top: 8px; }
  .grafico div { flex: 1; background: linear-gradient(0deg, var(--caramelo), var(--ouro)); border-radius: 3px 3px 0 0; min-height: 2px; }
  .grafico div.zero { background: var(--linha); }
  .vazio { text-align: center; padding: 30px 10px; color: var(--suave); }
  .fab { position: fixed; right: 18px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 4; width: 58px; height: 58px;
    border-radius: 50%; border: 0; background: var(--pri); color: var(--sobre-pri); font-size: 30px; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
  .modal { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.45); display: none; align-items: flex-end; justify-content: center; }
  .modal.aberto { display: flex; }
  .folha { background: var(--bg); width: 100%; max-width: 640px; max-height: 92vh; overflow: auto; border-radius: 18px 18px 0 0;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
  .folha h3 { margin: 0 0 12px; font-size: 19px; }
  .folha label { margin-bottom: 12px; }
  .folha p { margin: 0 0 10px; }
  .acoes { display: flex; gap: 10px; margin-top: 6px; }
  .acoes .btn { flex: 1; }
  #login { position: fixed; inset: 0; z-index: 30; color: var(--ouro); display: none; overflow: auto;
    flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; text-align: center;
    background: #2e1c11 repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 3px, transparent 3px 26px, rgba(0,0,0,.28) 26px 29px, transparent 29px 56px); }
  #login.aberto { display: flex; }
  #login img { width: 100%; max-width: 440px; border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.45); margin-bottom: 28px; }
  #login .sub { font: 400 13px var(--titulo); letter-spacing: .25em; margin-bottom: 14px; opacity: .85; }
  #login input { max-width: 220px; text-align: center; font-size: 26px; letter-spacing: .3em; background: #fbf3e4; color: #2b1a10; border: 1px solid var(--ouro); }
  #login .btn { background: linear-gradient(180deg, #f3dcaa, #d9b16a); color: #3a2417; margin-top: 14px; min-width: 220px; }
  #login .erro { min-height: 22px; margin-top: 10px; font-size: 14px; }
  #login .cfg { margin-top: 26px; max-width: 440px; width: 100%; font-size: 13px; opacity: .9; }
  #login .cfg input { max-width: none; font-size: 13px; letter-spacing: 0; text-align: left; }
  #login .cfg .btn { min-width: 0; padding: 8px 14px; font-size: 14px; margin-top: 8px; }
  #toast { position: fixed; font-family: var(--titulo); left: 50%; transform: translateX(-50%); bottom: calc(140px + env(safe-area-inset-bottom)); z-index: 40;
    background: #1f1a17; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; pointer-events: none;
    transition: opacity .2s; max-width: 90vw; text-align: center; }
  #toast.visivel { opacity: 1; }
  #toast.erro { background: var(--ruim); }
  .carregando { text-align: center; padding: 60px 0; color: var(--suave); }
  /* Balanço (relatório) */
  .rel { background: #fff; color: #1f1a17; border: 1px solid var(--linha); border-radius: 12px; padding: 16px 14px; font-size: 13px; line-height: 1.35; }
  .rel h1 { font: 600 20px var(--titulo); margin: 0; letter-spacing: .04em; }
  .rel .sub { color: #6b5b4e; margin: 2px 0 12px; font-size: 13px; }
  .rel h4 { font: 600 12px var(--titulo); text-transform: uppercase; letter-spacing: .1em; color: #6b5b4e; margin: 14px 0 6px; border-bottom: 1px solid #e6d8c3; padding-bottom: 3px; }
  .rel table { font-size: 12px; } .rel th, .rel td { padding: 4px 3px; border-bottom: 1px solid #efe6d8; color: #1f1a17; }
  .rel th { color: #6b5b4e; } .rel tr.total td { font-weight: 700; border-top: 2px solid #c9b58f; }
  .rel .kv { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dotted #e6d8c3; }
  .rel .kv.forte { font-weight: 700; border-bottom: 0; font-size: 14px; }
  .rel .rodape { margin-top: 14px; font-size: 11px; color: #8a7a6a; text-align: center; }
  #impressao { display: none; }
  @media print {
    body > *:not(#impressao) { display: none !important; }
    #impressao { display: block !important; }
    #impressao .rel { border: 0; padding: 0; font-size: 12pt; }
    #impressao .rel table { font-size: 10.5pt; }
    @page { margin: 14mm; }
  }
</style>
</head>
<body>

<header class="topo">
  <div class="titulo"><span id="titulo">Lu Salgados</span><span class="croissant">🥐</span></div>
  <div class="sync" id="sync"></div>
  <button class="icone" id="btnConfig" aria-label="Configurações">⚙</button>
  <button class="icone" id="btnAtualizar" aria-label="Atualizar">⟳</button>
</header>
<main id="tela"><div class="carregando">Carregando…</div></main>
<div id="extra"></div>

<script src="config.js"></script>
<script>
// ================= utilidades =================
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = n => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const pct = n => ((Number(n) || 0) * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%';
const qtd = n => (Number(n) || 0).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
// Aceita "4,5", "4.5", "1.500" (milhar) e "1.234,56"
function num(v) {
  if (typeof v === 'number') return v;
  v = String(v == null ? '' : v).trim().replace(/[^\d,.-]/g, '');
  if (!v) return 0;
  if (v.indexOf(',') >= 0) v = v.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(v)) v = v.replace(/\./g, '');
  const n = parseFloat(v);
  return isNaN(n) ? 0 : n;
}
const campoNum = n => (Number(n) ? String(n).replace('.', ',') : '');
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const hoje = () => iso(new Date());
function parteData(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d || 1); }
const somaDias = (s, n) => { const d = parteData(s); d.setDate(d.getDate() + n); return iso(d); };
const somaMes = (ym, n) => { const d = parteData(ym + '-01'); d.setMonth(d.getMonth() + n); return iso(d).slice(0, 7); };
const cap = t => t ? t[0].toUpperCase() + t.slice(1) : t;
const dataLonga = s => cap(parteData(s).toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' }));
const dataCurta = s => parteData(s).toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' });
const diaSemana = s => parteData(s).toLocaleDateString('pt-BR', { weekday: 'long' }).split('-')[0];
const nomeMes = ym => cap(parteData(ym + '-01').toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }));
const horaDe = t => { const d = new Date(t); return isNaN(d) ? '' : d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); };
function guardar(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function lerGuardado(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

let toastTimer;
function toast(msg, erro) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'visivel' + (erro ? ' erro' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = '', erro ? 5000 : 1800);
}
const setSync = m => $('#sync').textContent = m;

// ================= configuração do servidor =================
const CFG = window.LU_CONFIG || {};
const paramApi = new URLSearchParams(location.search).get('api');
if (paramApi) guardar('lu-api', paramApi.trim());
const API_URL = (lerGuardado('lu-api') || CFG.API_URL || '').trim();
const DEMO = !API_URL;
const MESES_CARREGADOS = 3;   // quantos meses o app baixa por padrão (meses anteriores carregam ao navegar)

// ================= estado =================
const S = { pin: '', dados: null, aba: 'dia', dia: hoje(), rascunho: null, sujo: false,
  mes: hoje().slice(0, 7), mesDesp: hoje().slice(0, 7), desde: somaMes(hoje().slice(0, 7), -(MESES_CARREGADOS - 1)) };
const CATEGORIAS = ['Embalagens', 'Gás', 'Óleo', 'Transporte', 'Equipamentos', 'Outros'];

const produtosOrdenados = () => S.dados.produtos.slice().sort((a, b) => (num(a.ordem) - num(b.ordem)) || String(a.nome).localeCompare(b.nome));
// Nome atual do produto (se foi renomeado, o histórico mostra o nome novo)

// ================= comunicação com a planilha =================
async function chamar(acao, dados) {
  if (DEMO) return mockApi(S.pin, acao, dados);
  const r = await fetch(API_URL, {
    method: 'POST', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ pin: S.pin, acao, dados, desde: S.desde })
  });
  const j = await r.json();
  if (!j.ok) throw new Error(j.erro || 'Erro no servidor');
  return j.dados;
}
// Devolve true (ok), false (erro) ou o objeto de conflito { conflito: ... }
async function enviar(acao, dados, msg) {
  setSync('Salvando…');
  try {
    const r = await chamar(acao, dados);
    setSync('');
    if (r && r.conflito !== undefined) return r;
    S.dados = r;
    if (msg) toast(msg);
    return true;
  } catch (e) {
    setSync('');
    tratarErro(e);
    return false;
  }
}
function tratarErro(e) {
  const m = (e && e.message) || String(e);
  if (/PIN/.test(m)) { sair(); return; }
  if (!navigator.onLine || /fetch|network|Failed/i.test(m)) {
    toast('Sem internet. O que você digitou fica guardado neste aparelho; tente salvar de novo mais tarde.', true);
    return;
  }
  toast('Não foi possível salvar: ' + m, true);
}
async function atualizar(silencioso) {
  setSync('Atualizando…');
  try {
    S.dados = await chamar('carregar');
    setSync('');
    if (!S.sujo) S.rascunho = null;
    // Não redesenha a tela de lançamento enquanto há digitação em andamento
    if (!(S.sujo && S.aba === 'dia')) render();
    if (!silencioso) toast('Dados atualizados');
  } catch (e) { setSync(''); if (!silencioso) tratarErro(e); }
}
// Garante que os dados do mês pedido estejam carregados (meses antigos vêm sob demanda)
async function garantirDesde(ym) {
  if (ym >= S.desde) return;
  S.desde = ym;
  await atualizar(true);
}

// Modo demonstração (sem servidor configurado): guarda dados só neste aparelho
function mockApi(pin, acao, dados) {
  return new Promise((ok, erro) => setTimeout(() => {
    if (pin !== '1234') return erro(new Error('PIN inválido'));
    let db = null;
    try { db = JSON.parse(localStorage.getItem('lu-demo')); } catch (e) {}
    if (!db) {
      db = { Produtos: [['Coxinha', 3, 4], ['Bolinho de carne', 2.4, 4], ['Bolinho de queijo', 2.7, 4], ['Quibe', 2.5, 4], ['Esfiha de carne', 1.2, 5], ['Hambúrguer', 3.5, 5]]
        .map((p, i) => ({ id: 'p' + i, nome: p[0], custo: p[1], preco: p[2], ordem: i + 1 })), Dias: [], Despesas: [], Config: {} };
    }
    const upsert = (k, o) => { o.id = o.id || String(Date.now()) + Math.random().toString(36).slice(2, 6); const i = db[k].findIndex(x => x.id === o.id); i >= 0 ? db[k][i] = o : db[k].push(o); };
    const remove = (k, id) => db[k] = db[k].filter(x => x.id !== id);
    if (acao === 'salvarProduto') upsert('Produtos', dados);
    if (acao === 'excluirProduto') remove('Produtos', dados);
    if (acao === 'salvarDespesa') upsert('Despesas', dados);
    if (acao === 'excluirDespesa') remove('Despesas', dados);
    if (acao === 'salvarConfig') Object.assign(db.Config, dados);
    if (acao === 'salvarDia') {
      const atual = db.Dias.find(x => x.id === dados.data);
      if (!dados.forcar && (dados.base || '') !== (atual ? atual.atualizadoEm || '' : '')) return ok({ conflito: atual || null });
      const itens = dados.itens.filter(i => i.prod > 0 || i.vend > 0);
      itens.length ? upsert('Dias', Object.assign({}, dados, { id: dados.data, itens, atualizadoEm: new Date().toISOString() })) : remove('Dias', dados.data);
    }
    try { localStorage.setItem('lu-demo', JSON.stringify(db)); } catch (e) {}
    ok(JSON.parse(JSON.stringify({ produtos: db.Produtos, dias: db.Dias, despesas: db.Despesas,
      config: Object.assign({ negocio: 'Lu Salgados', meta: 10000, limitePerda: 0.1, diasFunc: 26, margemSeguranca: 0.05, metaMargem: 0.5,
        motivos: 'Descartado, Doado, Consumo próprio, Vendido com desconto, Reaproveitado, Outro' }, db.Config) })));
  }, 200));
}

// ================= rascunho guardado no aparelho =================
function persistirRascunho() {
  if (S.rascunho && S.sujo) guardar('lu-rascunho', JSON.stringify(S.rascunho));
  else guardar('lu-rascunho', null);
}
function recuperarRascunho() {
  const r = lerGuardado('lu-rascunho');
  if (!r) return;
  try {
    const R = JSON.parse(r);
    if (!R || !R.data || !R.itens) return;
    S.rascunho = R; S.rascunho.recuperado = true;
    S.dia = R.data; S.sujo = true; S.aba = 'dia';
  } catch (e) { guardar('lu-rascunho', null); }
}

// ================= cálculos =================
function totaisItens(itens) {
  const t = { prod: 0, vend: 0, perd: 0, inv: 0, fat: 0, valPerd: 0 };
  itens.forEach(i => {
    const p = num(i.prod), v = num(i.vend), sobra = Math.max(p - v, 0);
    t.prod += p; t.vend += v; t.perd += sobra;
    t.inv += p * num(i.custo); t.fat += v * num(i.preco); t.valPerd += sobra * num(i.custo);
  });
  t.lucro = t.fat - t.inv;
  return t;
}
// Sugestão de produção: média do mesmo dia da semana (últimas 8 semanas); se faltar histórico, média geral de 30 dias
function sugestao(pid, ateData) {
  const dow = parteData(ateData).getDay();
  const amostra = filtro => {
    const v = [];
    S.dados.dias.forEach(d => {
      if (d.data >= ateData || !filtro(d)) return;
      const it = (d.itens || []).find(i => i.pid === pid);
      if (it && num(it.vend) > 0) v.push(num(it.vend));
    });
    return v;
  };
  const ini56 = somaDias(ateData, -56), ini30 = somaDias(ateData, -30);
  let v = amostra(d => d.data >= ini56 && parteData(d.data).getDay() === dow);
  let base = diaSemana(ateData) + 's';
  if (v.length < 2) { v = amostra(d => d.data >= ini30); base = 'média geral'; }
  if (!v.length) return null;
  const media = v.reduce((a, b) => a + b, 0) / v.length;
  return { qtd: Math.ceil(media * (1 + num(cfg().margemSeguranca))), base, n: v.length };
}
function resumoMes(ym) {
  const dias = S.dados.dias.filter(d => String(d.data).slice(0, 7) === ym).sort((a, b) => a.data < b.data ? -1 : 1);
  const r = { dias, prod: 0, vend: 0, perd: 0, inv: 0, fat: 0, valPerd: 0, diasComVenda: 0, porProduto: {}, destinos: {}, caixa: { pix: 0, dinheiro: 0, cartao: 0 } };
  dias.forEach(d => {
    const t = totaisItens(d.itens || []);
    d._t = t;
    ['prod', 'vend', 'perd', 'inv', 'fat', 'valPerd'].forEach(k => r[k] += t[k]);
    if (t.vend > 0) r.diasComVenda++;
    Object.keys(r.caixa).forEach(k => r.caixa[k] += num((d.caixa || {})[k]));
    (d.itens || []).forEach(i => {
      const k = i.pid || i.nome;
      const p = r.porProduto[k] = r.porProduto[k] || { nome: nomeProduto(i.pid, i.nome), pid: i.pid, prod: 0, vend: 0, perd: 0, inv: 0, fat: 0 };
      const pr = num(i.prod), v = num(i.vend), sobra = Math.max(pr - v, 0);
      p.prod += pr; p.vend += v; p.perd += sobra; p.inv += pr * num(i.custo); p.fat += v * num(i.preco);
      if (sobra > 0) {
        const m = i.motivo || 'Não informado';
        const dst = r.destinos[m] = r.destinos[m] || { q: 0, c: 0 };
        dst.q += sobra; dst.c += sobra * num(i.custo);
      }
    });
  });
  r.lucro = r.fat - r.inv;
  r.despesas = S.dados.despesas.filter(d => String(d.data).slice(0, 7) === ym).reduce((a, d) => a + num(d.valor), 0);
  return r;
}

// ================= LANÇAR DIA =================
function montarRascunho(data) {
  const reg = S.dados.dias.find(d => d.data === data);
  const snap = reg ? (reg.itens || []) : [];
  const itens = produtosOrdenados().map(p => {
    const s = snap.find(i => i.pid === p.id);
    return { pid: p.id, nome: p.nome, custo: s ? s.custo : num(p.custo), preco: s ? s.preco : num(p.preco),
      prod: s ? num(s.prod) : 0, vend: s ? num(s.vend) : 0, motivo: s ? s.motivo || '' : '' };
  });
  snap.forEach(s => { if (!itens.some(i => i.pid === s.pid)) itens.push(Object.assign({}, s, { antigo: true })); });
  return { data, itens, existe: !!reg, base: reg ? reg.atualizadoEm || '' : '', obs: reg ? reg.obs || '' : '',
    caixa: Object.assign({ pix: 0, dinheiro: 0, cartao: 0 }, reg ? reg.caixa || {} : {}) };
}
async function trocarDia(nova) {
  if (!nova || nova === S.dia) return;
  if (S.sujo && !confirm('Há lançamentos não salvos neste dia. Trocar de data mesmo assim? (o rascunho continua guardado)')) { render(); return; }
  S.dia = nova; S.rascunho = null; S.sujo = false; persistirRascunho();
  await garantirDesde(nova.slice(0, 7));   // data antiga: carrega o mês antes de mostrar
  render(); window.scrollTo(0, 0);
}

function marcarSujo() { S.sujo = true; persistirRascunho(); const b = $('#salvarDia'); if (b) b.textContent = 'Salvar •'; }
function atualizarCard(card, it, inicial) {
  const sobra = Math.max(num(it.prod) - num(it.vend), 0);
  const box = card.querySelector('[data-sobra]');
  box.querySelector('b').textContent = qtd(sobra);
  box.classList.toggle('tem', sobra > 0);
  card.querySelector('[data-motivo-box]').style.display = sobra > 0 ? '' : 'none';
  if (!inicial) atualizarTotais();

function atualizarTotais() {
  const R = S.rascunho, t = totaisItens(R.itens);
  $('#tInv').textContent = brl(t.inv);
  $('#tFat').textContent = brl(t.fat);
  const l = $('#tLuc'); l.textContent = brl(t.lucro); l.className = t.lucro >= 0 ? 'pos' : 'neg';
  const soma = ['pix', 'dinheiro', 'cartao'].reduce((a, k) => a + num(R.caixa[k]), 0);
  const c = $('#conferencia');
  if (!soma) c.innerHTML = '<span class="muted">Preencha para conferir com o total vendido (' + brl(t.fat) + ').</span>';
  else if (Math.abs(soma - t.fat) < 0.01) c.innerHTML = '<span class="pos">✔ Caixa confere com o vendido: ' + brl(soma) + '</span>';
  else c.innerHTML = `<span class="neg">Caixa ${brl(soma)} × vendido ${brl(t.fat)}: diferença de ${brl(soma - t.fat)}</span>`;
}

async function salvarDia(forcar, msg) {
  const R = S.rascunho;
  const itens = R.itens.filter(i => num(i.prod) > 0 || num(i.vend) > 0).map(i => ({
    pid: i.pid, nome: i.nome, custo: num(i.custo), preco: num(i.preco), prod: num(i.prod), vend: num(i.vend),
    motivo: Math.max(num(i.prod) - num(i.vend), 0) > 0 ? i.motivo : ''
  }));
  if (!itens.length && !R.existe) { toast('Nada para salvar: preencha produzidos ou vendidos.'); return; }
  if (!forcar) {
    const excedeu = itens.filter(i => i.vend > i.prod && i.prod > 0);
    if (excedeu.length && !confirm('Vendidos maior que produzidos em: ' + excedeu.map(i => i.nome).join(', ') + '. Salvar assim mesmo?')) return;
    const semDestino = itens.filter(i => i.prod > i.vend && !i.motivo);
    if (semDestino.length && !confirm('Sobra sem destino informado em: ' + semDestino.map(i => i.nome).join(', ') + '. Salvar assim mesmo?')) return;
  }
  const btn = $('#salvarDia'); if (btn) btn.disabled = true;
  const r = await enviar('salvarDia', { data: R.data, itens, caixa: R.caixa, obs: R.obs, base: R.base, forcar: !!forcar }, msg || 'Dia salvo ✔');
  if (r === true) { S.sujo = false; S.rascunho = null; persistirRascunho(); render(); return; }
  if (btn) btn.disabled = false;
  if (r && r.conflito !== undefined) mostrarConflito(r.conflito);
}
// Outro aparelho salvou este dia depois que ele foi aberto aqui
function mostrarConflito(outro) {
  const t = outro ? totaisItens(outro.itens || []) : null;
  abrirModal(`<h3>Este dia foi alterado em outro aparelho</h3>
    ${outro ? `<p>Às <b>${esc(horaDe(outro.atualizadoEm))}</b> foi salvo: <b>${qtd(t.prod)}</b> produzidos, <b>${qtd(t.vend)}</b> vendidos, <b>${brl(t.fat)}</b> em vendas.</p>`
             : '<p>O lançamento deste dia foi <b>apagado</b> no outro aparelho.</p>'}
    <p class="small muted">Para não perder o trabalho de ninguém, escolha o que fazer:</p>
    <button class="btn cheio" id="cfUsar">Usar a versão do outro aparelho</button>
    <div class="small muted" style="margin:4px 0 8px">Descarta o que você digitou aqui e mostra a versão salva.</div>
    <button class="btn sec cheio" id="cfSobre">Sobrescrever com a minha versão</button>
    <div class="small muted" style="margin:4px 0 8px">Grava o que está nesta tela por cima do que foi salvo lá.</div>
    <button class="btn sec cheio" id="cfCanc">Voltar e revisar</button>`, () => {
    $('#cfUsar').onclick = async () => { fecharModal(); S.sujo = false; S.rascunho = null; persistirRascunho(); await atualizar(true); toast('Mostrando a versão do outro aparelho'); };
    $('#cfSobre').onclick = () => { fecharModal(); salvarDia(true); };
    $('#cfCanc').onclick = fecharModal;
  });
}

// ================= PAINEL =================
function telaPainel() {
  const r = resumoMes(S.mes), c = cfg();
  const meta = num(c.meta), diasFunc = num(c.diasFunc), limite = num(c.limitePerda), metaMargem = num(c.metaMargem);
  const margem = r.fat ? r.lucro / r.fat : 0, perdaPct = r.prod ? r.perd / r.prod : 0;
  const media = r.diasComVenda ? r.fat / r.diasComVenda : 0;
  const falta = Math.max(meta - r.fat, 0), diasRest = Math.max(diasFunc - r.diasComVenda, 0);
  const progresso = meta ? Math.min(r.fat / meta, 1) : 0;
  const liquido = r.lucro - r.despesas;
  let h = `<div class="navdata"><button id="mAnt">‹</button><div class="meio"><b>${nomeMes(S.mes)}</b></div><button id="mProx">›</button></div>`;
  if (!r.dias.length) {
    h += `<div class="vazio">Nenhum dia lançado em ${nomeMes(S.mes).toLowerCase()}.</div>`;
  } else {
    h += `<button class="btn sec cheio" id="balancoMes" style="margin:0 0 12px">📄 Balanço do mês (imprimir / enviar)</button>`;
    h += `<div class="grade2">
      <div class="kpi"><div class="r">Faturamento</div><div class="v">${brl(r.fat)}</div><div class="d">${qtd(r.vend)} salgados vendidos</div></div>
      <div class="kpi"><div class="r">Investimento</div><div class="v">${brl(r.inv)}</div><div class="d">${qtd(r.prod)} produzidos × custo</div></div>
      <div class="kpi"><div class="r">Lucro do painel</div><div class="v ${r.lucro >= 0 ? 'pos' : 'neg'}">${brl(r.lucro)}</div><div class="d">vendas − custo dos produzidos</div></div>
      <div class="kpi"><div class="r">Margem</div><div class="v ${margem >= metaMargem ? 'pos' : ''}">${pct(margem)}</div><div class="d">meta ${pct(metaMargem)}</div></div>
      <div class="kpi"><div class="r">% de perda</div><div class="v ${perdaPct > limite ? 'neg' : 'pos'}">${pct(perdaPct)}</div><div class="d">${qtd(r.perd)} não vendidos · limite ${pct(limite)}</div></div>
      <div class="kpi"><div class="r">Prejuízo c/ perdas</div><div class="v">${brl(r.valPerd)}</div><div class="d">custo das sobras</div></div>
      <div class="kpi"><div class="r">Venda média/dia</div><div class="v">${brl(media)}</div><div class="d">${r.diasComVenda} dia(s) com venda</div></div>
      <div class="kpi"><div class="r">Projeção do mês</div><div class="v">${brl(media * diasFunc)}</div><div class="d">${diasFunc} dias de funcionamento</div></div>
    </div>`;
    if (meta) h += `<h2>Meta do mês</h2><div class="card">
      <div class="item-top"><b>${brl(r.fat)}</b><span class="muted">de ${brl(meta)} · ${pct(meta ? r.fat / meta : 0)}</span></div>
      <div class="barra"><div style="width:${(progresso * 100).toFixed(1)}%"></div></div>
      <div class="small muted">Falta ${brl(falta)} · ${diasRest} dia(s) restantes · precisa vender ${brl(diasRest ? falta / diasRest : 0)}/dia</div>
      ${media * diasFunc >= meta ? '<div class="small pos" style="margin-top:4px">✔ No ritmo para bater a meta</div>' : '<div class="small neg" style="margin-top:4px">⚠ Abaixo do ritmo da meta</div>'}
    </div>`;
    h += `<h2>Resultado do mês</h2><div class="card">
      <div class="lista-linha"><span>Lucro do painel (salgados)</span><b>${brl(r.lucro)}</b></div>
      <div class="lista-linha"><span>Outras despesas do mês</span><b>− ${brl(r.despesas)}</b></div>
      <div class="lista-linha"><span><b>Resultado</b></span><b class="${liquido >= 0 ? 'pos' : 'neg'}">${brl(liquido)}</b></div>
    </div>`;
    const cx = r.caixa, somaCx = cx.pix + cx.dinheiro + cx.cartao;
    if (somaCx) h += `<h2>Como recebeu</h2><div class="card">
      ${[['Pix', cx.pix], ['Dinheiro', cx.dinheiro], ['Cartão', cx.cartao]].filter(x => x[1]).map(x =>
        `<div class="lista-linha"><span>${x[0]}</span><span>${brl(x[1])} <span class="muted small">(${pct(x[1] / somaCx)})</span></span></div>`).join('')}
    </div>`;
    const prods = Object.values(r.porProduto).sort((a, b) => b.fat - a.fat);
    h += `<h2>Análise por produto</h2><div class="card" style="padding:8px 10px"><table>
      <tr><th>Produto</th><th class="n">Vend.</th><th class="n">Lucro</th><th class="n">Perda</th></tr>
      ${prods.map(p => { const pp = p.prod ? p.perd / p.prod : 0; return `<tr><td>${esc(p.nome)}</td><td class="n">${qtd(p.vend)}</td>
        <td class="n ${p.fat - p.inv >= 0 ? '' : 'neg'}">${brl(p.fat - p.inv)}</td><td class="n ${pp > limite ? 'neg' : ''}">${pct(pp)}</td></tr>`; }).join('')}
    </table></div>`;
    const dest = Object.keys(r.destinos).sort((a, b) => r.destinos[b].q - r.destinos[a].q);
    if (dest.length) h += `<h2>Destino das sobras</h2><div class="card" style="padding:8px 10px"><table>
      <tr><th>Destino</th><th class="n">Unidades</th><th class="n">Custo</th></tr>
      ${dest.map(k => `<tr><td>${esc(k)}</td><td class="n">${qtd(r.destinos[k].q)}</td><td class="n">${brl(r.destinos[k].c)}</td></tr>`).join('')}
    </table></div>`;
    const ultimo = parteData(S.mes + '-01'); ultimo.setMonth(ultimo.getMonth() + 1); ultimo.setDate(0);
    const nDias = ultimo.getDate(), porDia = {};
    r.dias.forEach(d => porDia[+d.data.slice(8)] = d._t.fat);
    const max = Math.max(1, ...Object.values(porDia));
    h += `<h2>Faturamento por dia</h2><div class="card"><div class="grafico">
      ${Array.from({ length: nDias }, (_, i) => { const v = porDia[i + 1] || 0; return `<div class="${v ? '' : 'zero'}" style="height:${Math.max(2, v / max * 100)}%" title="${i + 1}: ${brl(v)}"></div>`; }).join('')}
      </div><div class="item-top small muted"><span>1</span><span>${nDias}</span></div></div>`;
    h += `<h2>Dias lançados</h2><div class="card" style="padding:4px 14px">
      ${r.dias.slice().reverse().map(d => `<div class="lista-linha"><button class="link" data-abrir="${d.data}"><b>${cap(dataCurta(d.data))}</b>
        <div class="small muted">${qtd(d._t.vend)} vendidos · perda ${pct(d._t.prod ? d._t.perd / d._t.prod : 0)}</div></button>
        <div style="text-align:right"><b>${brl(d._t.fat)}</b><div class="small ${d._t.lucro >= 0 ? 'pos' : 'neg'}">lucro ${brl(d._t.lucro)}</div></div></div>`).join('')}
    </div>`;
  }
  const amanha = somaDias(hoje(), 1);
  const sugs = produtosOrdenados().map(p => ({ nome: p.nome, s: sugestao(p.id, amanha) })).filter(x => x.s);
  if (sugs.length) h += `<h2>Sugestão de produção para amanhã (${esc(diaSemana(amanha))})</h2><div class="card" style="padding:4px 14px">
    ${sugs.map(x => `<div class="lista-linha"><span>${esc(x.nome)} <span class="small muted">(${esc(x.s.base)}, ${x.s.n} dia${x.s.n > 1 ? 's' : ''})</span></span><b>${x.s.qtd}</b></div>`).join('')}
    <div class="small muted" style="padding:8px 0">Média vendida no mesmo dia da semana (8 semanas) + ${pct(cfg().margemSeguranca)} de segurança. Sem histórico suficiente, usa a média geral de 30 dias.</div></div>`;
  h += `<div class="small muted" style="text-align:center;margin-top:14px">Dados carregados desde ${nomeMes(S.desde).toLowerCase()}. Meses anteriores carregam ao navegar.</div>`;
  $('#tela').innerHTML = h;
  $('#mAnt').onclick = async () => { S.mes = somaMes(S.mes, -1); await garantirDesde(S.mes); render(); };
  $('#mProx').onclick = () => { S.mes = somaMes(S.mes, 1); render(); };
  if ($('#balancoMes')) $('#balancoMes').onclick = () => abrirRelatorio(relatorioMes(S.mes));
  document.querySelectorAll('[data-abrir]').forEach(b => b.onclick = () => {
    if (S.sujo && !confirm('Há um rascunho não salvo em ' + dataLonga(S.rascunho.data) + '. Abrir outro dia mesmo assim?')) return;
    S.dia = b.dataset.abrir; S.rascunho = null; S.sujo = false; persistirRascunho(); S.aba = 'dia'; render(); window.scrollTo(0, 0);
  });
}

// ================= BALANÇO (relatório para imprimir / enviar) =================
const agoraTxt = () => new Date().toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const linhaKv = (k, v, forte) => `<div class="kv ${forte ? 'forte' : ''}"><span>${esc(k)}</span><b>${esc(v)}</b></div>`;
const cabRel = (titulo, sub) => `<h1>${esc(cfg().negocio || 'Lu Salgados')}</h1><div class="sub">${esc(titulo)}${sub ? ' · ' + esc(sub) : ''}</div>`;
const rodapeRel = () => `<div class="rodape">Gerado em ${agoraTxt()} pelo app ${esc(cfg().negocio || 'Lu Salgados')}. Custos por unidade conforme tabela de preços vigente no dia do lançamento.</div>`;

// Balanço de um dia: produção, vendas, sobras, caixa
function relatorioDia(data) {
  const d = S.dados.dias.find(x => x.data === data);
  if (!d) return null;
  const itens = (d.itens || []).slice().sort((a, b) => num(b.vend) * num(b.preco) - num(a.vend) * num(a.preco));
  const t = totaisItens(itens);
  const cx = d.caixa || {}, somaCx = num(cx.pix) + num(cx.dinheiro) + num(cx.cartao);
  const titulo = 'Balanço do dia ' + dataLonga(data);
  let h = `<div class="rel">${cabRel(titulo)}
    <h4>Produção e vendas</h4>
    <table><tr><th>Produto</th><th class="n">Prod.</th><th class="n">Vend.</th><th class="n">Sobra</th><th class="n">Custo</th><th class="n">Venda</th><th class="n">Lucro</th></tr>
    ${itens.map(i => { const p = num(i.prod), v = num(i.vend), inv = p * num(i.custo), fat = v * num(i.preco);
      return `<tr><td>${esc(nomeProduto(i.pid, i.nome))}</td><td class="n">${qtd(p)}</td><td class="n">${qtd(v)}</td><td class="n">${qtd(Math.max(p - v, 0))}</td><td class="n">${brl(inv)}</td><td class="n">${brl(fat)}</td><td class="n">${brl(fat - inv)}</td></tr>`; }).join('')}
    <tr class="total"><td>Total</td><td class="n">${qtd(t.prod)}</td><td class="n">${qtd(t.vend)}</td><td class="n">${qtd(t.perd)}</td><td class="n">${brl(t.inv)}</td><td class="n">${brl(t.fat)}</td><td class="n">${brl(t.lucro)}</td></tr></table>
    <h4>Resumo</h4>
    ${linhaKv('Faturamento (vendas)', brl(t.fat))}${linhaKv('Custo dos produzidos', brl(t.inv))}${linhaKv('Prejuízo com sobras (custo)', brl(t.valPerd))}
    ${linhaKv('% de perda', pct(t.prod ? t.perd / t.prod : 0))}${linhaKv('Lucro do dia', brl(t.lucro), true)}`;
  if (somaCx) h += `<h4>Caixa (recebimentos)</h4>${linhaKv('Pix', brl(cx.pix))}${linhaKv('Dinheiro', brl(cx.dinheiro))}${linhaKv('Cartão', brl(cx.cartao))}
    ${linhaKv('Total recebido', brl(somaCx), true)}${Math.abs(somaCx - t.fat) >= 0.01 ? linhaKv('Diferença caixa × vendas', brl(somaCx - t.fat)) : ''}`;
  const sobras = itens.filter(i => num(i.prod) > num(i.vend));
  if (sobras.length) h += `<h4>Destino das sobras</h4>${sobras.map(i => linhaKv(nomeProduto(i.pid, i.nome) + ' (' + qtd(num(i.prod) - num(i.vend)) + ' un.)', i.motivo || 'Não informado')).join('')}`;
  if (d.obs) h += `<h4>Observações</h4><div>${esc(d.obs)}</div>`;
  h += rodapeRel() + '</div>';
  const texto = [`*${cfg().negocio || 'Lu Salgados'} — ${titulo}*`, '',
    ...itens.map(i => `• ${nomeProduto(i.pid, i.nome)}: ${qtd(i.prod)} prod. / ${qtd(i.vend)} vend. → ${brl(num(i.vend) * num(i.preco))}`), '',
    `Faturamento: ${brl(t.fat)}`, `Custo dos produzidos: ${brl(t.inv)}`, `Sobras: ${qtd(t.perd)} un. (${brl(t.valPerd)})`, `*Lucro do dia: ${brl(t.lucro)}*`,
    ...(somaCx ? ['', `Caixa: Pix ${brl(cx.pix)} · Dinheiro ${brl(cx.dinheiro)} · Cartão ${brl(cx.cartao)} = ${brl(somaCx)}`] : []),
    ...(d.obs ? ['', 'Obs.: ' + d.obs] : [])].join('\n');
  return { html: h, texto, titulo, arquivo: 'balanco-' + data };
}

// Balanço de um mês: dia a dia, por produto, despesas, resultado
function relatorioMes(ym) {
  const r = resumoMes(ym);
  if (!r.dias.length) return null;
  const titulo = 'Balanço de ' + nomeMes(ym);
  const desp = S.dados.despesas.filter(d => String(d.data).slice(0, 7) === ym).sort((a, b) => a.data < b.data ? -1 : 1);
  const prods = Object.values(r.porProduto).sort((a, b) => b.fat - a.fat);
  const cx = r.caixa, somaCx = cx.pix + cx.dinheiro + cx.cartao;
  let h = `<div class="rel">${cabRel(titulo, r.dias.length + ' dia(s) lançado(s)')}
    <h4>Resultado do mês</h4>
    ${linhaKv('Faturamento (vendas)', brl(r.fat))}${linhaKv('Custo dos produzidos', brl(r.inv))}${linhaKv('Lucro dos salgados', brl(r.lucro))}
    ${linhaKv('Outras despesas', '− ' + brl(r.despesas))}${linhaKv('Resultado do mês', brl(r.lucro - r.despesas), true)}
    ${linhaKv('Salgados produzidos / vendidos / sobras', qtd(r.prod) + ' / ' + qtd(r.vend) + ' / ' + qtd(r.perd))}${linhaKv('% de perda', pct(r.prod ? r.perd / r.prod : 0))}${linhaKv('Prejuízo com sobras (custo)', brl(r.valPerd))}
    <h4>Dia a dia</h4>
    <table><tr><th>Dia</th><th class="n">Prod.</th><th class="n">Vend.</th><th class="n">Custo</th><th class="n">Vendas</th><th class="n">Lucro</th></tr>
    ${r.dias.map(d => `<tr><td>${cap(dataCurta(d.data))}</td><td class="n">${qtd(d._t.prod)}</td><td class="n">${qtd(d._t.vend)}</td><td class="n">${brl(d._t.inv)}</td><td class="n">${brl(d._t.fat)}</td><td class="n">${brl(d._t.lucro)}</td></tr>`).join('')}
    <tr class="total"><td>Total</td><td class="n">${qtd(r.prod)}</td><td class="n">${qtd(r.vend)}</td><td class="n">${brl(r.inv)}</td><td class="n">${brl(r.fat)}</td><td class="n">${brl(r.lucro)}</td></tr></table>
    <h4>Por produto</h4>
    <table><tr><th>Produto</th><th class="n">Prod.</th><th class="n">Vend.</th><th class="n">Sobra</th><th class="n">Vendas</th><th class="n">Lucro</th></tr>
    ${prods.map(p => `<tr><td>${esc(p.nome)}</td><td class="n">${qtd(p.prod)}</td><td class="n">${qtd(p.vend)}</td><td class="n">${qtd(p.perd)}</td><td class="n">${brl(p.fat)}</td><td class="n">${brl(p.fat - p.inv)}</td></tr>`).join('')}</table>`;
  if (somaCx) h += `<h4>Recebimentos</h4>${linhaKv('Pix', brl(cx.pix))}${linhaKv('Dinheiro', brl(cx.dinheiro))}${linhaKv('Cartão', brl(cx.cartao))}${linhaKv('Total informado no caixa', brl(somaCx), true)}`;
  h += `<h4>Outras despesas</h4>` + (desp.length ? `<table><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th class="n">Valor</th></tr>
    ${desp.map(d => `<tr><td>${parteData(d.data).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })}</td><td>${esc(d.descricao)}</td><td>${esc(d.categoria)}</td><td class="n">${brl(d.valor)}</td></tr>`).join('')}
    <tr class="total"><td colspan="3">Total</td><td class="n">${brl(r.despesas)}</td></tr></table>` : '<div class="muted">Nenhuma despesa lançada.</div>');
  const dest = Object.keys(r.destinos);
  if (dest.length) h += `<h4>Destino das sobras</h4>${dest.map(k => linhaKv(k, qtd(r.destinos[k].q) + ' un. · ' + brl(r.destinos[k].c))).join('')}`;
  h += rodapeRel() + '</div>';
  const texto = [`*${cfg().negocio || 'Lu Salgados'} — ${titulo}*`, `${r.dias.length} dia(s) lançado(s)`, '',
    `Faturamento: ${brl(r.fat)}`, `Custo dos produzidos: ${brl(r.inv)}`, `Lucro dos salgados: ${brl(r.lucro)}`, `Outras despesas: ${brl(r.despesas)}`, `*Resultado do mês: ${brl(r.lucro - r.despesas)}*`, '',
    `Produzidos ${qtd(r.prod)} · vendidos ${qtd(r.vend)} · sobras ${qtd(r.perd)} (${pct(r.prod ? r.perd / r.prod : 0)})`,
    ...(somaCx ? [`Recebido: Pix ${brl(cx.pix)} · Dinheiro ${brl(cx.dinheiro)} · Cartão ${brl(cx.cartao)}`] : []), '',
    ...prods.map(p => `• ${p.nome}: ${qtd(p.vend)} vend. → ${brl(p.fat)} (lucro ${brl(p.fat - p.inv)})`)].join('\n');
  return { html: h, texto, titulo, arquivo: 'balanco-' + ym };
}

function abrirRelatorio(rel) {
  if (!rel) { toast('Não há lançamentos para este período.'); return; }
  const podeCompartilhar = !!navigator.share;
  abrirModal(`<h3>${esc(rel.titulo)}</h3>
    <div class="acoes" style="margin-bottom:12px">
      <button class="btn" id="relImprimir">🖨 Imprimir / PDF</button>
      <button class="btn sec" id="relEnviar">${podeCompartilhar ? '📤 Enviar' : '📋 Copiar texto'}</button>
      <button class="btn sec" id="relFechar" style="flex:0 0 auto">✕</button>
    </div>
    <div class="small muted" style="margin:-4px 0 10px">Imprimir abre a tela do celular onde você escolhe <b>Salvar como PDF</b> e envia para a contadora. "Enviar" manda um resumo em texto (WhatsApp, e-mail).</div>
    ${rel.html}`, () => {
    $('#relFechar').onclick = fecharModal;
    $('#relImprimir').onclick = () => {
      const tituloAntes = document.title;
      $('#impressao').innerHTML = rel.html;
      document.title = rel.arquivo;                       // vira o nome sugerido do PDF
      const fim = () => { document.title = tituloAntes; $('#impressao').innerHTML = ''; window.removeEventListener('afterprint', fim); };
      window.addEventListener('afterprint', fim);
      setTimeout(() => window.print(), 50);
      setTimeout(fim, 60000);
    };
    $('#relEnviar').onclick = async () => {
      if (navigator.share) {
        try { await navigator.share({ title: rel.titulo, text: rel.texto }); } catch (e) { /* cancelado */ }
      } else {
        try { await navigator.clipboard.writeText(rel.texto); toast('Texto copiado. Cole no WhatsApp ou e-mail.'); }
        catch (e) { toast('Não foi possível copiar.', true); }
      }
    };
  });
}

// ================= DESPESAS =================
function telaDespesas() {
  const lista = S.dados.despesas.filter(d => String(d.data).slice(0, 7) === S.mesDesp).sort((a, b) => a.data < b.data ? 1 : -1);
  const total = lista.reduce((a, d) => a + num(d.valor), 0);
  const porCat = {};
  lista.forEach(d => porCat[d.categoria || 'Outros'] = (porCat[d.categoria || 'Outros'] || 0) + num(d.valor));
  let h = `<div class="navdata"><button id="mAnt">‹</button><div class="meio"><b>${nomeMes(S.mesDesp)}</b></div><button id="mProx">›</button></div>
    <div class="kpi" style="margin-bottom:10px"><div class="r">Total de despesas</div><div class="v">${brl(total)}</div>
    <div class="d">${Object.keys(porCat).map(k => esc(k) + ' ' + brl(porCat[k])).join(' · ') || 'Nenhuma despesa no mês'}</div></div>
    <div class="alerta aviso small">Lance aqui só o que <b>não</b> está no custo unitário dos salgados: gás, embalagens, óleo, transporte, equipamentos. Os ingredientes já entram pelo custo de cada salgado (aba Preços); não lance de novo.</div>`;
  if (lista.length) {
    h += `<div class="card" style="padding:4px 14px">${lista.map(d => `<div class="lista-linha"><button class="link" data-id="${esc(d.id)}">
      <b>${esc(d.descricao || d.categoria)}</b><div class="small muted">${cap(dataCurta(d.data))} · ${esc(d.categoria)}</div></button>
      <b>${brl(d.valor)}</b></div>`).join('')}</div>`;
  }
  $('#tela').innerHTML = h;
  $('#extra').innerHTML = '<button class="fab" id="novaDesp" aria-label="Nova despesa">+</button>';
  $('#mAnt').onclick = async () => { S.mesDesp = somaMes(S.mesDesp, -1); await garantirDesde(S.mesDesp); render(); };
  $('#mProx').onclick = () => { S.mesDesp = somaMes(S.mesDesp, 1); render(); };
  $('#novaDesp').onclick = () => formDespesa(null);
  document.querySelectorAll('[data-id]').forEach(b => b.onclick = () => formDespesa(S.dados.despesas.find(d => d.id === b.dataset.id)));
}
function formDespesa(d) {
  const novo = !d;
  d = d || { data: S.mesDesp === hoje().slice(0, 7) ? hoje() : S.mesDesp + '-01', descricao: '', categoria: 'Embalagens', valor: '' };
  let cat = d.categoria;
  const cats = CATEGORIAS.indexOf(cat) >= 0 ? CATEGORIAS : CATEGORIAS.concat([cat]);
  abrirModal(`<h3>${novo ? 'Nova despesa' : 'Editar despesa'}</h3>
    <label>Valor<input id="fValor" inputmode="decimal" value="${campoNum(d.valor)}" placeholder="0,00"></label>
    <label>Categoria<div class="chips" id="fCat">${cats.map(c => `<button type="button" class="chip ${c === cat ? 'ativo' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div></label>
    <label>Descrição<input id="fDesc" value="${esc(d.descricao)}" placeholder="Ex.: botijão de gás"></label>
    <label>Data<input id="fData" type="date" value="${esc(d.data)}"></label>
    <div class="acoes">${novo ? '' : '<button class="btn perigo" id="fExc">Excluir</button>'}<button class="btn sec" id="fCanc">Cancelar</button><button class="btn" id="fOk">Salvar</button></div>`, f => {
    f.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { cat = b.dataset.c; f.querySelectorAll('[data-c]').forEach(x => x.classList.toggle('ativo', x === b)); });
    $('#fCanc').onclick = fecharModal;
    $('#fOk').onclick = async () => {
      const valor = num($('#fValor').value);
      if (!valor) { toast('Informe o valor.'); return; }
      if (!$('#fData').value) { toast('Informe a data.'); return; }
      $('#fOk').disabled = true;
      if (await enviar('salvarDespesa', { id: d.id, data: $('#fData').value, descricao: $('#fDesc').value.trim(), categoria: cat, valor, criadoEm: d.criadoEm }, 'Despesa salva') === true) { fecharModal(); render(); }
      else $('#fOk').disabled = false;
    };
    if (!novo) $('#fExc').onclick = async () => { if (confirm('Excluir esta despesa?') && await enviar('excluirDespesa', d.id, 'Despesa excluída') === true) { fecharModal(); render(); } };
    if (novo) setTimeout(() => $('#fValor').focus(), 50);
  });
}

// ================= PREÇOS =================
function telaPrecos() {
  const lista = produtosOrdenados();
  let h = `<div class="alerta aviso small">Novos preços valem para os próximos lançamentos. Dias já salvos mantêm o preço da época. O <b>custo unitário</b> deve incluir todos os ingredientes de uma unidade.</div>`;
  if (!lista.length) h += `<div class="vazio">Nenhum salgado cadastrado. Toque em <b>+</b> para adicionar.</div>`;
  else h += `<div class="card" style="padding:8px 10px"><table>
    <tr><th>Produto</th><th class="n">Custo</th><th class="n">Venda</th><th class="n">Margem</th></tr>
    ${lista.map(p => { const c = num(p.custo), v = num(p.preco), m = v ? (v - c) / v : 0;
      return `<tr data-id="${esc(p.id)}" style="cursor:pointer"><td><b>${esc(p.nome)}</b><div class="small ${v - c < 0 ? 'neg' : 'muted'}">${v - c < 0 ? 'prejuízo' : 'lucro'} ${brl(v - c)}/un.</div></td>
      <td class="n">${brl(c)}</td><td class="n">${brl(v)}</td><td class="n ${m < 0 ? 'neg' : (m >= num(cfg().metaMargem) ? 'pos' : '')}">${pct(m)}</td></tr>`; }).join('')}
  </table></div><div class="small muted" style="text-align:center">Toque em um salgado para editar.</div>`;
  $('#tela').innerHTML = h;
  $('#extra').innerHTML = '<button class="fab" id="novoProd" aria-label="Novo salgado">+</button>';
  $('#novoProd').onclick = () => formProduto(null);
  document.querySelectorAll('tr[data-id]').forEach(tr => tr.onclick = () => formProduto(S.dados.produtos.find(p => p.id === tr.dataset.id)));
}
function formProduto(p) {
  const novo = !p;
  p = p || { nome: '', custo: '', preco: '', ordem: Math.max(0, ...S.dados.produtos.map(x => num(x.ordem))) + 1 };
  abrirModal(`<h3>${novo ? 'Novo salgado' : 'Editar salgado'}</h3>
    <label>Nome<input id="fNome" value="${esc(p.nome)}" placeholder="Ex.: Coxinha"></label>
    <div class="grade2">
      <label>Custo unitário<input id="fCusto" inputmode="decimal" value="${campoNum(p.custo)}" placeholder="0,00"></label>
      <label>Preço de venda<input id="fPreco" inputmode="decimal" value="${campoNum(p.preco)}" placeholder="0,00"></label>
    </div>
    <div id="fLucro" class="small muted" style="margin:-4px 0 12px"></div>
    <label>Posição na lista<input id="fOrdem" inputmode="numeric" value="${esc(p.ordem)}"></label>
    <div class="acoes">${novo ? '' : '<button class="btn perigo" id="fExc">Excluir</button>'}<button class="btn sec" id="fCanc">Cancelar</button><button class="btn" id="fOk">Salvar</button></div>`, () => {
    const calc = () => { const c = num($('#fCusto').value), v = num($('#fPreco').value); $('#fLucro').textContent = v ? `${v - c < 0 ? 'Prejuízo' : 'Lucro'} por unidade ${brl(v - c)} · margem ${pct((v - c) / v)}` : ''; };
    $('#fCusto').oninput = $('#fPreco').oninput = calc; calc();
    $('#fCanc').onclick = fecharModal;
    $('#fOk').onclick = async () => {
      const nome = $('#fNome').value.trim();
      if (!nome) { toast('Informe o nome.'); return; }
      $('#fOk').disabled = true;
      if (await enviar('salvarProduto', { id: p.id, nome, custo: num($('#fCusto').value), preco: num($('#fPreco').value), ordem: num($('#fOrdem').value) }, 'Salgado salvo') === true) { fecharModal(); render(); }
      else $('#fOk').disabled = false;
    };
    if (!novo) $('#fExc').onclick = async () => {
      if (confirm('Excluir "' + p.nome + '" da tabela? Os dias já lançados continuam com o histórico.') && await enviar('excluirProduto', p.id, 'Salgado excluído') === true) { fecharModal(); render(); }
    };
    if (novo) setTimeout(() => $('#fNome').focus(), 50);
  });
}

// ================= CONFIGURAÇÕES =================
function abrirConfig() {
  const c = cfg();
  const campoPct = v => campoNum(Math.round(num(v) * 1000) / 10);
  abrirModal(`<h3>Configurações</h3>
    <label>Nome do negócio<input id="cNeg" value="${esc(c.negocio)}"></label>
    <div class="grade2">
      <label>Meta de faturamento mensal (R$)<input id="cMeta" inputmode="decimal" value="${campoNum(c.meta)}"></label>
      <label>Dias de funcionamento no mês<input id="cDias" inputmode="numeric" value="${campoNum(c.diasFunc)}"></label>
      <label>Limite aceitável de perda (%)<input id="cPerda" inputmode="decimal" value="${campoPct(c.limitePerda)}"></label>
      <label>Meta de margem (%)<input id="cMargem" inputmode="decimal" value="${campoPct(c.metaMargem)}"></label>
      <label>Margem de segurança na produção (%)<input id="cSeg" inputmode="decimal" value="${campoPct(c.margemSeguranca)}"></label>
    </div>
    <label>Destinos da sobra (separe por vírgula)<textarea id="cMot" rows="2">${esc(c.motivos)}</textarea></label>
    <div class="acoes"><button class="btn sec" id="cCanc">Cancelar</button><button class="btn" id="cOk">Salvar</button></div>
    <button class="btn perigo cheio" id="cSair">Sair deste aparelho</button>
    <div class="small muted" style="margin-top:14px">${DEMO ? 'Modo demonstração: dados guardados só neste aparelho.' : 'Servidor: ' + esc(API_URL.slice(0, 60)) + '…'}</div>`, () => {
    $('#cCanc').onclick = fecharModal;
    $('#cSair').onclick = () => { fecharModal(); sair(); };
    $('#cOk').onclick = async () => {
      $('#cOk').disabled = true;
      const dados = { negocio: $('#cNeg').value.trim() || 'Lu Salgados', meta: num($('#cMeta').value), diasFunc: num($('#cDias').value),
        limitePerda: num($('#cPerda').value) / 100, metaMargem: num($('#cMargem').value) / 100,
        margemSeguranca: num($('#cSeg').value) / 100, motivos: $('#cMot').value };
      if (await enviar('salvarConfig', dados, 'Configurações salvas') === true) { fecharModal(); render(); }
      else $('#cOk').disabled = false;
    };
  });
}

// ================= início =================
(function iniciar() {
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (DEMO && location.protocol !== 'file:') $('#cfgServidor').style.display = '';
  if (!navigator.onLine) setSync('Sem internet');
  const salvo = lerGuardado('lu-pin');
  if (salvo) entrar(salvo, true);
  else { $('#login').classList.add('aberto'); setTimeout(() => $('#pinInput').focus(), 100); }
})();
</script>
</body>
</html>
